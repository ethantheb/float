# Builds the extension from a version tag and publishes a GitHub Release with
# the zipped dist/, its SHA-256 checksum, and a signed build-provenance
# attestation (verify with `gh attestation verify <zip> --repo <owner>/float`).
#
# Release: `npm version <patch|minor|major>` then `git push --follow-tags`.

name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # Sigstore signing certificate
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Package
        run: |
          zip_name="float-$GITHUB_REF_NAME.zip"
          (cd dist && zip -r -X "../$zip_name" .)
          sha256sum "$zip_name" > SHA256SUMS
          cat SHA256SUMS
          echo "ZIP=$zip_name" >> "$GITHUB_ENV"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ZIP }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "Float $GITHUB_REF_NAME"
